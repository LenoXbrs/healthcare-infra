version: '3.8'

services:
  # ── Banco de Dados (PostgreSQL) ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres-service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: healthcare123
      # Note: criamos um DB default padrão do Postgres
      POSTGRES_DB: postgres
    volumes:
      # Monta o script SQL para criar os 3 bancos na inicialização
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache (Redis) ────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis-service
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mensageria (RabbitMQ) ────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-service
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── API Pacientes ────────────────────────────────────────────────────────
  pacientes:
    image: 0luiseduardo/healthcare-api-pacientes:latest
    container_name: pacientes-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthcare_pacientes
      DB_USER: postgres
      DB_PASSWORD: healthcare123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── API Usuários ─────────────────────────────────────────────────────────
  usuarios:
    image: 0luiseduardo/healthcare-api-usuarios:latest
    container_name: usuarios-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthcare_users
      DB_USER: postgres
      DB_PASSWORD: healthcare123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      PORT: 8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── API Triagem ──────────────────────────────────────────────────────────
  triagem:
    image: 0luiseduardo/healthcare-api-triagem:latest
    container_name: triagem-service
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthcare_triagem
      DB_USER: postgres
      DB_PASSWORD: healthcare123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      PORT: 8083
      PACIENTES_URL: "http://pacientes:8081"
      USUARIOS_URL: "http://usuarios:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ── API Gateway ──────────────────────────────────────────────────────────
  gateway:
    image: 0luiseduardo/healthcare-gateway:latest
    container_name: gateway-service
    ports:
      - "30080:8080"
    environment:
      PACIENTES_URL: "http://pacientes:8081"
      USUARIOS_URL: "http://usuarios:8082"
      TRIAGEM_URL: "http://triagem:8083"
      PORT: 8080
    depends_on:
      - pacientes
      - usuarios
      - triagem

  # ── Frontend (Angular + Nginx) ───────────────────────────────────────────
  frontend:
    image: 0luiseduardo/healthcare-front-end:latest
    container_name: frontend-service
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  postgres-data:
